name: Build macOS Universal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS Universal (arm64 + x86_64)
    runs-on: macos-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect project root
        id: project-dir
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "manifest=Cargo.toml" >> "$GITHUB_OUTPUT"
            echo "workdir=." >> "$GITHUB_OUTPUT"
          elif [ -f "workspace/Cargo.toml" ]; then
            echo "manifest=workspace/Cargo.toml" >> "$GITHUB_OUTPUT"
            echo "workdir=workspace" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Cargo.toml not found!" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ steps.project-dir.outputs.workdir }}/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run test suite (85 tests)
        run: |
          set -euo pipefail
          echo "Running cargo test -p cstrip2..."
          cargo test -p cstrip2 --manifest-path "${{ steps.project-dir.outputs.manifest }}"

      - name: Build Universal VST3 and CLAP via xtask
        run: |
          set -euo pipefail
          cd "${{ steps.project-dir.outputs.workdir }}"
          echo "Building universal bundles via cargo xtask..."
          cargo xtask bundle-universal cstrip2 --release
          cd - > /dev/null

      - name: Organize VST3 and CLAP artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts

          WORKDIR="${{ steps.project-dir.outputs.workdir }}"
          VST3_SRC=$(find "$WORKDIR/target" -type d -name "*strip2*.vst3" | head -n 1)
          CLAP_SRC=$(find "$WORKDIR/target" -type d -name "*strip2*.clap" | head -n 1)

          if [ -z "$VST3_SRC" ] || [ -z "$CLAP_SRC" ]; then
            echo "ERROR: Could not locate built VST3 or CLAP bundle in $WORKDIR/target" >&2
            find "$WORKDIR/target" -maxdepth 4 >&2
            exit 1
          fi

          echo "Found VST3 at: $VST3_SRC"
          echo "Found CLAP at: $CLAP_SRC"

          cp -R "$VST3_SRC" ./artifacts/CStrip2.vst3
          cp -R "$CLAP_SRC" ./artifacts/CStrip2.clap

      - name: Verify VST3 and CLAP architectures with lipo
        run: |
          set -euo pipefail
          echo "=== VST3 Architectures ==="
          VST3_BIN=$(find ./artifacts/CStrip2.vst3/Contents/MacOS -type f | head -n 1)
          lipo -info "$VST3_BIN"

          echo "=== CLAP Architectures ==="
          CLAP_BIN=$(find ./artifacts/CStrip2.clap/Contents/MacOS -type f | head -n 1)
          lipo -info "$CLAP_BIN"

      - name: Use bundled AUv2 dependencies (or fetch them when absent)
        run: |
          set -euo pipefail
          # The source release already contains these three directories.
          # Preserve the original GitHub workflow for checkouts that do not.
          if [ -d clap-wrapper ]; then
            test -f clap-wrapper/LICENSE || { echo "Incomplete clap-wrapper directory" >&2; exit 1; }
            echo "Using bundled clap-wrapper sources"
          else
            git clone --depth 1 --branch v0.16.0 https://github.com/free-audio/clap-wrapper.git clap-wrapper
          fi
          if [ -d AudioUnitSDK ]; then
            test -f AudioUnitSDK/LICENSE.txt || { echo "Incomplete AudioUnitSDK directory" >&2; exit 1; }
            echo "Using bundled AudioUnitSDK sources"
          else
            git clone --depth 1 --branch AudioUnitSDK-1.1.0 https://github.com/apple/AudioUnitSDK.git AudioUnitSDK
          fi
          if [ -d clap ]; then
            test -f clap/LICENSE || { echo "Incomplete CLAP SDK directory" >&2; exit 1; }
            echo "Using bundled CLAP SDK sources"
          else
            git clone --depth 1 --branch 1.2.3 https://github.com/free-audio/clap.git clap
          fi

      - name: Build Universal AUv2 component
        run: |
          set -euo pipefail
          echo "Configuring CMake for AUv2 Universal build..."
          cmake -B build-au -S cmake/auv2 \
            -DCLAP_WRAPPER_DIR="$PWD/clap-wrapper" \
            -DCLAP_SDK_ROOT="$PWD/clap" \
            -DAUDIOUNIT_SDK_ROOT="$PWD/AudioUnitSDK" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_BUILD_TYPE=Release

          echo "Building AUv2 component..."
          cmake --build build-au --config Release --target CStrip2_auv2

          AU_SRC=$(find build-au -name "*Strip2*.component" -o -name "*strip2*.component" -type d | head -n 1)
          if [ -z "$AU_SRC" ]; then
            AU_SRC=$(find build-au -name "*.component" -type d | head -n 1)
          fi

          if [ -z "$AU_SRC" ]; then
            echo "ERROR: Could not locate built .component bundle in build-au" >&2
            find build-au -maxdepth 4 >&2
            exit 1
          fi

          echo "Found AUv2 component at: $AU_SRC"
          cp -R "$AU_SRC" ./artifacts/CStrip2.component

      - name: Configure AUv2 metadata and embed CLAP autonomously
        run: |
          set -euo pipefail
          # Thick bundle pattern: embed CStrip2.clap exclusively into Contents/PlugIns/
          # (Official macOS bundle specification for subsidiary plug-in bundles)
          mkdir -p ./artifacts/CStrip2.component/Contents/PlugIns
          cp -R ./artifacts/CStrip2.clap ./artifacts/CStrip2.component/Contents/PlugIns/

          # Update Info.plist with proprietary AMR AUv2 identity and sandboxSafe=False
          python3 - << 'EOF'
          import plistlib, os

          plist_path = "./artifacts/CStrip2.component/Contents/Info.plist"
          if os.path.exists(plist_path):
              with open(plist_path, "rb") as f:
                  pl = plistlib.load(f)
          else:
              pl = {}

          pl["CFBundleIdentifier"] = "com.amr.audio.cstrip2"
          pl["CFBundleName"] = "CStrip2"
          pl["CFBundleExecutable"] = "CStrip2"
          pl["CFBundleShortVersionString"] = "0.1.0"
          pl["CFBundleVersion"] = "0.1.0"

          if "AudioComponents" not in pl or not pl["AudioComponents"]:
              pl["AudioComponents"] = [{}]

          comp = pl["AudioComponents"][0]
          comp["type"] = "aufx"
          comp["subtype"] = "Cs2A"
          comp["manufacturer"] = "AMR2"
          comp["name"] = "AMR: CStrip2"
          comp["description"] = "CStrip2 — Airwindows DSP port"
          comp["sandboxSafe"] = False
          comp["version"] = 65536

          with open(plist_path, "wb") as f:
              plistlib.dump(pl, f)

          print("Configured Info.plist: type=aufx, subtype=Cs2A, manufacturer=AMR2, id=com.amr.audio.cstrip2, sandboxSafe=False")
          EOF

      - name: Verify AUv2 architectures with lipo
        run: |
          set -euo pipefail
          echo "=== AUv2 Architectures ==="
          AU_BIN=$(find ./artifacts/CStrip2.component/Contents/MacOS -type f | head -n 1)
          lipo -info "$AU_BIN"

      - name: Free ad-hoc codesign
        run: |
          set -euo pipefail
          echo "Applying ad-hoc signature (codesign --force --deep --sign -)..."
          codesign --force --deep --sign - ./artifacts/CStrip2.vst3
          codesign --force --deep --sign - ./artifacts/CStrip2.clap
          codesign --force --deep --sign - ./artifacts/CStrip2.component

          echo "=== Verifying codesign ==="
          codesign --verify --deep --strict --verbose=2 ./artifacts/CStrip2.vst3
          codesign --verify --deep --strict --verbose=2 ./artifacts/CStrip2.clap
          codesign --verify --deep --strict --verbose=2 ./artifacts/CStrip2.component

      - name: Validate autonomous AUv2 with auval
        run: |
          set -euo pipefail
          # STRICT VALIDATION: Install ONLY CStrip2.component into ~/Library/Audio/Plug-Ins/Components/
          # DO NOT install CStrip2.clap into ~/Library/Audio/Plug-Ins/CLAP/
          # This proves that CStrip2.component is completely self-contained and autonomous.
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R ./artifacts/CStrip2.component ~/Library/Audio/Plug-Ins/Components/

          # Reset AudioComponentRegistrar cache
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2

          echo "Running auval -v aufx Cs2A AMR2 against autonomous component..."
          set +e
          auval -v aufx Cs2A AMR2 2>&1 | tee ./artifacts/AUVAL.txt
          AUVAL_EXIT=${PIPESTATUS[0]}
          set -e

          echo "auval completed with exit status: $AUVAL_EXIT"
          if [ "$AUVAL_EXIT" -ne 0 ]; then
            echo "ERROR: auval validation failed (exit status $AUVAL_EXIT). Check AUVAL.txt for details."
            exit 1
          fi

      - name: Generate build info and documentation
        run: |
          set -euo pipefail
          VST3_BIN=$(find ./artifacts/CStrip2.vst3/Contents/MacOS -type f | head -n 1)
          CLAP_BIN=$(find ./artifacts/CStrip2.clap/Contents/MacOS -type f | head -n 1)
          AU_BIN=$(find ./artifacts/CStrip2.component/Contents/MacOS -type f | head -n 1)

          cat << EOF > ./artifacts/BUILD_INFO.txt
          ================================================================================
          CStrip2 macOS Universal 2 Build Info
          ================================================================================
          Build Timestamp (UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Runner OS: macOS $(sw_vers -productVersion) (Build $(sw_vers -buildVersion))
          Runner Arch: $(uname -m)
          Git Commit: $(git rev-parse HEAD 2>/dev/null || echo "N/A")
          Rust Toolchain: $(rustc --version)
          Cargo Version: $(cargo --version)

          Pinned Dependencies:
          - free-audio/clap-wrapper: tag v0.16.0 (commit 69fdf55)
          - apple/AudioUnitSDK: tag AudioUnitSDK-1.1.0 (commit 53a9a20)
          - free-audio/clap: tag 1.2.3

          Universal 2 Binaries:
          - VST3: $(lipo -info "$VST3_BIN" 2>&1)
          - CLAP: $(lipo -info "$CLAP_BIN" 2>&1)
          - AUv2: $(lipo -info "$AU_BIN" 2>&1)

          Audio Unit Identifiers:
          - Type: aufx (0x61756678)
          - Subtype: Cs2A (0x43733241)
          - Manufacturer: AMR2 (0x414d5232)
          - Bundle Identifier: com.amr.audio.cstrip2
          - Display Name: AMR: CStrip2
          - Description: CStrip2 — Airwindows DSP port
          - Sandbox Safe: false (conservative / unverified)

          Code Signing:
          - Ad-hoc signature (--sign -) applied and strictly verified

          Verification Suite:
          - 85/85 Rust unit and integration tests passed
          - Autonomous AUv2 validation passed (auval -v aufx Cs2A AMR2)
          ================================================================================
          EOF

          # Copy MAC_INSTALL.txt to artifacts folder
          if [ -f "MAC_INSTALL.txt" ]; then
            cp MAC_INSTALL.txt ./artifacts/
          elif [ -f "${{ steps.project-dir.outputs.workdir }}/MAC_INSTALL.txt" ]; then
            cp "${{ steps.project-dir.outputs.workdir }}/MAC_INSTALL.txt" ./artifacts/
          fi

      - name: Upload Universal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CStrip2-macOS-Universal
          path: artifacts/
          retention-days: 14
